<!-- ===== ชุดที่ 6: ไฟล์ index.html (หน้าแอป) — แก้เฉพาะบรรทัด APP_URL ===== -->
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ระบบวันลา พมจ.สงขลา</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#4f46e5">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="วันลา พมจ.">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <style>
    html,body{margin:0;height:100%;overflow:hidden;background:#fff;font-family:Sarabun,'Noto Sans Thai',system-ui,sans-serif}
    #app{position:fixed;left:0;right:0;top:env(safe-area-inset-top);bottom:env(safe-area-inset-bottom);width:100%;
         height:calc(100% - env(safe-area-inset-top) - env(safe-area-inset-bottom));border:0;display:block;background:#f1f5f9}
    .scr{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
         padding:24px;text-align:center;color:#fff;background:linear-gradient(135deg,#4f46e5,#7c3aed 55%,#c026d3);transition:opacity .35s}
    .scr img{width:96px;height:96px;border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
    .scr h1{margin:0;font-size:22px}.scr p{margin:0;opacity:.9;font-size:14px;line-height:1.6}
    .bar{width:140px;height:4px;border-radius:4px;background:rgba(255,255,255,.3);overflow:hidden}
    .bar::after{content:'';display:block;width:40%;height:100%;background:#fff;border-radius:4px;animation:ld 1.1s ease-in-out infinite}
    @keyframes ld{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
    .scr button{margin-top:6px;border:0;border-radius:12px;padding:10px 24px;font-size:15px;font-weight:600;background:#fff;color:#4f46e5}
    .hide{opacity:0;pointer-events:none}
  </style>
</head>
<body>
  <iframe id="app" title="ระบบวันลา พมจ.สงขลา" allow="clipboard-write; fullscreen"></iframe>
  <div id="splash" class="scr"><img src="icons/icon-192.png" alt=""><h1>ระบบวันลา</h1><p>สำนักงาน พมจ.สงขลา</p><div class="bar"></div></div>
  <div id="offline" class="scr hide"><img src="icons/icon-192.png" alt=""><h1>ไม่มีการเชื่อมต่ออินเทอร์เน็ต</h1>
    <p>กรุณาตรวจสอบการเชื่อมต่อแล้วลองใหม่</p><button onclick="start()">ลองใหม่</button></div>
  <div id="cfgerr" class="scr hide"><h1>ยังตั้งค่าหน้าแอปไม่ถูกต้อง</h1>
    <p>กรุณาแก้บรรทัด APP_URL ในไฟล์ index.html<br>ให้เป็น URL ของ Web App ที่ลงท้ายด้วย /exec</p></div>

<script>
/* ===== แก้บรรทัดนี้: วาง URL ของ Web App (ลงท้ายด้วย /exec) ===== */
const APP_URL = 'https://script.google.com/macros/s/AKfycby2S0Mc4SwYI_62fdRPr_Ery00Bbbhsap_IypPJzQmbqwqYubGOCxJG4DZTiSjfbnnU/exec';
/* โหมดแสดงผล: 'iframe' = เต็มจอแบบแอป (แนะนำ) | 'redirect' = เปิดหน้าระบบตรงๆ (ใช้เมื่อโหมด iframe ใช้ไม่ได้) */
const MODE = 'iframe';

const KEY = 'lv_token';
const $id = id => document.getElementById(id);
const frame = $id('app'), splash = $id('splash'), off = $id('offline'), cfg = $id('cfgerr');
const standalone = matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches || navigator.standalone === true;
const show = el => el.classList.remove('hide'), hide = el => el.classList.add('hide');
let appWin = null, appOrigin = '', deferred = null, timer = null;

function start() {
  if (!/^https:\/\/script\.google\.com\/(a\/macros\/[^\/]+\/|macros\/)s\/[\w-]{20,}\/exec$/.test(APP_URL)) { hide(splash); show(cfg); return; }
  if (!navigator.onLine) { hide(splash); show(off); return; }
  const page = (new URLSearchParams(location.search).get('page') || '').replace(/[^a-z]/g, '');
  if (MODE === 'redirect') { location.replace(APP_URL + (page ? '?page=' + page : '')); return; }
  hide(off); show(splash);
  frame.src = APP_URL + '?pwa=1' + (page ? '&page=' + page : '');
  clearTimeout(timer); timer = setTimeout(() => hide(splash), 8000);
}
frame.addEventListener('load', () => { if (frame.src) setTimeout(() => hide(splash), 1200); });
addEventListener('online', () => { if (!off.classList.contains('hide')) start(); });

// รับข้อความเฉพาะจากระบบวันลาที่อยู่ในกรอบของหน้านี้เท่านั้น
function fromOurFrame(w) {
  try { for (let i = 0; i < 6 && w; i++) { if (w === frame.contentWindow) return true; if (w === w.parent) break; w = w.parent; } } catch (e) {}
  return false;
}
function send(msg) { if (appWin) appWin.postMessage(Object.assign({ src: 'lv-shell' }, msg), appOrigin); }

addEventListener('message', e => {
  const d = e.data;
  if (!d || d.src !== 'lv-app') return;
  if (!/^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/.test(e.origin) || !fromOurFrame(e.source)) return;
  appWin = e.source; appOrigin = e.origin;
  if (d.type === 'hello') send({ type: 'init', token: localStorage.getItem(KEY) || '', standalone, canInstall: !!deferred });
  else if (d.type === 'token') d.token ? localStorage.setItem(KEY, d.token) : localStorage.removeItem(KEY);
  else if (d.type === 'ready') { clearTimeout(timer); hide(splash); }
  else if (d.type === 'install') install();
});

addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; send({ type: 'state', canInstall: true }); });
addEventListener('appinstalled', () => { deferred = null; send({ type: 'state', canInstall: false, installed: true }); });
async function install() {
  if (!deferred) return send({ type: 'installResult', outcome: 'unavailable' });
  deferred.prompt();
  const r = await deferred.userChoice;
  deferred = null;
  send({ type: 'installResult', outcome: r.outcome });
}

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
start();
</script>
</body>
</html>
